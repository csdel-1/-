  <!-- ============================================================
       텍스트 영역
       실제 로고 이미지 기준:
         상단: "법무사 안상재 사무소"  → 금색
         하단: "개인회생·개인파산 전문" → 짙은 검정, 굵게
  ============================================================ -->

  <!-- 상단: 법무사 안상재 사무소 (금색) -->
  <text
    x="80" y="30"
    font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
    font-size="21" font-weight="800" letter-spacing="1"
    fill="url(#gGold)">법무사 안상재 사무소</text>

  <!-- 구분선 -->
  <rect x="80" y="36" width="234" height="1" rx="0.5" fill="#C49A00" opacity="0.25"/>

  <!-- 하단: 개인회생·개인파산 전문 (검정색, 굵게) -->
  <text
    x="81" y="58"
    font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
    font-size="17" font-weight="700" letter-spacing="0.5"
    fill="#1a1a1a">개인회생 · 개인파산 전문</text>

</svg>
