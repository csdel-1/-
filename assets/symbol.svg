<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="200" height="210">
  <defs>
    <style>
      .g { fill: #C49A00; }
      .w { fill: #FFFFFF; }
    </style>
  </defs>

  <!--
    법무사 공식 문양 정밀 재현
    실제 이미지 기반: 구름5판 외곽 + 오각형방패 + 7햇살 + 法 + 하단날개
    viewBox 200×210, 중심 cx=100
  -->

  <!-- ══════════════════════════════════════
       1. 외곽 구름 꽃잎 5판 (Gold fill)
       실제: 두꺼운 구름 외곽이 전체를 감쌈
  ══════════════════════════════════════ -->
  <path class="g" d="
    M 100,4
    C 107,4  115,7  119,13
    C 123,19  122,27  118,32
    C 124,32  131,35  135,41
    C 139,47  138,56  134,61
    C 140,63  145,68  147,75
    C 149,82  147,91  142,96
    C 146,101 147,110 143,116
    C 139,122 132,124 126,122
    C 123,129 119,136 114,140
    C 109,144 103,145 100,144
    C 97,145  91,144  86,140
    C 81,136  77,129  74,122
    C 68,124  61,122  57,116
    C 53,110  54,101  58,96
    C 53,91   51,82   53,75
    C 55,68   60,63   66,61
    C 62,56   61,47   65,41
    C 69,35   76,32   82,32
    C 78,27   77,19   81,13
    C 85,7    93,4   100,4 Z
  "/>

  <!-- ══════════════════════════════════════
       2. 안쪽 흰 음각 (구름 내부 여백)
       Gold 꽃잎 두께 약 8~10px
  ══════════════════════════════════════ -->
  <path class="w" d="
    M 100,14
    C 105,14  111,17  114,22
    C 117,27  116,34  113,38
    C 119,39  126,43  129,49
    C 132,55  131,63  127,68
    C 133,70  137,76  138,83
    C 139,90  137,98  132,102
    C 136,107 137,115 133,120
    C 129,125 123,126 118,124
    C 115,130 111,136 107,139
    C 104,142 101,142 100,142
    C 99,142  96,142  93,139
    C 89,136  85,130  82,124
    C 77,126  71,125  67,120
    C 63,115  64,107  68,102
    C 63,98   61,90   62,83
    C 63,76   67,70   73,68
    C 69,63   68,55   71,49
    C 74,43   81,39   87,38
    C 84,34   83,27   86,22
    C 89,17   95,14  100,14 Z
  "/>

  <!-- ══════════════════════════════════════
       3. 오각형 본체 (Gold)
       상단 꼭지 100,22 → 우상 138,52 → 우하 124,110 → 좌하 76,110 → 좌상 62,52
  ══════════════════════════════════════ -->
  <polygon class="g"
    points="100,22  138,52  124,110  76,110  62,52"/>

  <!-- ══════════════════════════════════════
       4. 햇살 7개 흰색 쐐기 (방사선)
       중심점 (100,86), 위쪽 부채꼴로 7개
       각도: -90°부터 시작, 약 22.5°씩 간격
  ══════════════════════════════════════ -->
  <!-- 햇살1: 정중앙 -->
  <polygon class="w" points="100,86  96,22  104,22"/>
  <!-- 햇살2: 우1 -->
  <polygon class="w" points="100,86  108,24  117,30"/>
  <!-- 햇살3: 우2 -->
  <polygon class="w" points="100,86  123,35  130,44"/>
  <!-- 햇살4: 우3 -->
  <polygon class="w" points="100,86  134,50  138,60"/>
  <!-- 햇살5: 좌1 -->
  <polygon class="w" points="100,86  92,24   83,30"/>
  <!-- 햇살6: 좌2 -->
  <polygon class="w" points="100,86  77,35   70,44"/>
  <!-- 햇살7: 좌3 -->
  <polygon class="w" points="100,86  66,50   62,60"/>

  <!-- ══════════════════════════════════════
       5. 양쪽 날개 흰색 음각 (타원형 잎사귀)
       法 좌우에 대칭, 안쪽으로 기울어진 타원
  ══════════════════════════════════════ -->
  <!-- 좌측 날개 음각 -->
  <ellipse class="w" cx="76" cy="93" rx="9" ry="15"
    transform="rotate(-25,76,93)"/>
  <!-- 우측 날개 음각 -->
  <ellipse class="w" cx="124" cy="93" rx="9" ry="15"
    transform="rotate(25,124,93)"/>

  <!-- ══════════════════════════════════════
       6. 하단 역V 날개 (Gold) — 실제 이미지의 하단 넓은 날개
  ══════════════════════════════════════ -->
  <polygon class="g"
    points="62,110  138,110  130,145  100,155  70,145"/>

  <!-- ══════════════════════════════════════
       7. 하단 날개 내부 흰색 음각
  ══════════════════════════════════════ -->
  <path class="w" d="
    M 72,114 C 72,114  84,120  100,120 C 116,120  128,114  128,114
    L 120,140 C 113,148 107,150 100,150
    C 93,150  87,148  80,140 Z
  "/>

  <!-- ══════════════════════════════════════
       8. 중앙 흰 원 (法 배경)
  ══════════════════════════════════════ -->
  <circle class="w" cx="100" cy="86" r="26"/>

  <!-- ══════════════════════════════════════
       9. 한자 '法' — 실제 이미지 기반 재현
       굵고 간결한 현대 서체 스타일
       삼수변(氵) 3점 + 去 구조
  ══════════════════════════════════════ -->

  <!-- 삼수변 (氵) — 좌측 3개의 가로 붓 점 -->
  <rect class="g" x="72"  y="73" width="8" height="5.5" rx="1.5"/>
  <rect class="g" x="72"  y="83" width="8" height="5.5" rx="1.5"/>
  <rect class="g" x="72"  y="93" width="8" height="5.5" rx="1.5"/>

  <!-- 去 부분 — 상단 가로획 -->
  <rect class="g" x="83"  y="73" width="22" height="5" rx="1.5"/>
  <!-- 중앙 세로획 (ㅣ 형태) -->
  <rect class="g" x="91"  y="73" width="5"  height="14" rx="1.5"/>
  <!-- 중단 가로획 -->
  <rect class="g" x="83"  y="83" width="22" height="5" rx="1.5"/>
  <!-- 하단 가로획 -->
  <rect class="g" x="83"  y="93" width="22" height="5" rx="1.5"/>
  <!-- 하단 좌 세로획 -->
  <rect class="g" x="83"  y="93" width="5"  height="9" rx="1.5"/>
  <!-- 하단 우 세로획 -->
  <rect class="g" x="100" y="93" width="5"  height="9" rx="1.5"/>

</svg>
